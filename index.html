<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Set the theme class before first paint (localStorage, then system preference) -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('net-asia-theme');
          var t = s === 'light' || s === 'dark' ? s : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          var r = document.documentElement;
          r.classList.remove('light', 'dark');
          r.classList.add(t);
        } catch (e) {}
      })();
    </script>

    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-5LXMFNWH');</script>
    <!-- End Google Tag Manager -->

    <!-- PWA -->
    <meta name="application-name"                  content="NET Asia" />
    <meta name="theme-color"                       content="#08080F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color"                       content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable"       content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title"         content="NET Asia" />
    <meta name="mobile-web-app-capable"             content="yes" />

    <!-- Icons -->
    <link rel="icon"             type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts -->
